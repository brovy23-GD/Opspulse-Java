services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opspulse
      POSTGRES_USER: opspulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspulse_local_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspulse -d opspulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - opspulse_pgdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/opspulse
      DATABASE_USER: opspulse
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-opspulse_local_only}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  opspulse_pgdata: